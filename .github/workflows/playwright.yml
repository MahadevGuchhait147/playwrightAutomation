name: Playwright Tests

on:
  push:
    branches:
      - create-playwright-framwork
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_Automation

    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://qaplayground.com' }}
      QA_COMPANY_PATH: ${{ vars.QA_COMPANY_PATH || '/bank/login' }}
      QA_COMPANY_USERNAME: ${{ secrets.QA_COMPANY_USERNAME }}
      QA_COMPANY_PASSWORD: ${{ secrets.QA_COMPANY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Playwright_Automation/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: e2e
        run: npm test

      - name: Upload Playwright HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_Automation/playwright-report
          if-no-files-found: warn
          retention-days: 14

