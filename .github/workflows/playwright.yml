name: Playwright Tests

on:
  push:
    branches:
      - create-playwright-framwork
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Playwright_Automation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Playwright_Automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:unit

      - name: Run Stryker
        run: npm run test:mutate

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: Playwright_Automation/stryker-report
          if-no-files-found: ignore

  e2e-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_Automation

    env:
      QA_COMPANY_PATH: ${{ vars.QA_COMPANY_PATH || '/bank/login' }}
      QA_COMPANY_USERNAME: ${{ secrets.QA_COMPANY_USERNAME }}
      QA_COMPANY_PASSWORD: ${{ secrets.QA_COMPANY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Playwright_Automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Playwright Report
        uses: actions/upload-pages-artifact@v3
        with:
          path: Playwright_Automation/playwright-report

  deploy:
    needs: [mutate, e2e-test]

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
