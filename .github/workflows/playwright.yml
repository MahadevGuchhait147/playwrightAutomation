name: Playwright Tests

on:
  push:
    branches:
      - create-playwright-framwork
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: Playwright_Automation

    env:
      QA_COMPANY_PATH: ${{ vars.QA_COMPANY_PATH || '/bank/login' }}
      QA_COMPANY_USERNAME: ${{ secrets.QA_COMPANY_USERNAME }}
      QA_COMPANY_PASSWORD: ${{ secrets.QA_COMPANY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Playwright_Automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run Vitest
        run: npx vitest run --reporter=json --outputFile=vitest-report.json

      - name: Show Vitest results
        if: always()
        run: |
          node <<'EOF'
          const fs = require('fs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const reportPath = 'vitest-report.json';
          if (!summaryPath) process.exit(0);
          let body = '## Vitest\n\nNo vitest-report.json was produced.\n';
          if (fs.existsSync(reportPath)) {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            body = [
              '## Vitest',
              '',
              `| Metric | Count |`,
              `| --- | ---: |`,
              `| Test files | ${report.numTotalTestSuites ?? 0} |`,
              `| Passed | ${report.numPassedTests ?? 0} |`,
              `| Failed | ${report.numFailedTests ?? 0} |`,
              `| Total tests | ${report.numTotalTests ?? 0} |`,
              '',
            ].join('\n');
          }
          fs.appendFileSync(summaryPath, body);
          EOF

      - name: Run Stryker
        env:
          GITHUB_ACTIONS: 'false'
          GITHUB_STEP_SUMMARY: /dev/null
        run: npm run test:mutate

      - name: Show Stryker results
        if: always()
        run: |
          node <<'EOF'
          const fs = require('fs');
          const reportPath = 'stryker-report/mutation.json';
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          if (!fs.existsSync(reportPath) || !summaryPath) {
            console.log('Stryker JSON report not found.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const mutants = Object.values(report.files || {}).flatMap((file) => file.mutants || []);
          const counts = mutants.reduce((acc, mutant) => {
            acc[mutant.status] = (acc[mutant.status] || 0) + 1;
            return acc;
          }, {});
          const killed = counts.Killed || 0;
          const survived = counts.Survived || 0;
          const noCoverage = counts.NoCoverage || 0;
          const timeout = counts.Timeout || 0;
          const total = mutants.length;
          const detected = killed + (counts.Timeout || 0) + (counts.RuntimeError || 0) + (counts.CompileError || 0);
          const covered = total - noCoverage;
          const score = total ? ((detected / total) * 100).toFixed(2) : '0.00';
          const coveredScore = covered ? ((killed / covered) * 100).toFixed(2) : '0.00';
          const lines = [
            '## Stryker mutation report',
            '',
            `| Metric | Count |`,
            `| --- | ---: |`,
            `| Total mutants | ${total} |`,
            `| Killed | ${killed} |`,
            `| Survived | ${survived} |`,
            `| No coverage | ${noCoverage} |`,
            `| Timeout | ${timeout} |`,
            `| Mutation score | ${score}% |`,
            `| Score (covered) | ${coveredScore}% |`,
            '',
            'GitHub Pages: [Stryker report](https://mahadev-clanap.github.io/Automation-demo/stryker/)',
            '',
          ];
          fs.appendFileSync(summaryPath, lines.join('\n'));
          console.log(lines.join('\n'));
          EOF

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: Playwright_Automation/stryker-report
          if-no-files-found: warn

  e2e-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_Automation

    env:
      QA_COMPANY_PATH: ${{ vars.QA_COMPANY_PATH || '/bank/login' }}
      QA_COMPANY_USERNAME: ${{ secrets.QA_COMPANY_USERNAME }}
      QA_COMPANY_PASSWORD: ${{ secrets.QA_COMPANY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Playwright_Automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_Automation/playwright-report
          if-no-files-found: warn

  pages:
    needs: [mutate, e2e-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Download Playwright report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: site/playwright

      - name: Download Stryker report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stryker-report
          path: site/stryker

      - name: Create report home page
        run: |
          mkdir -p site
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Automation-demo reports</title>
              <style>
                body { font-family: sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
                a { display: block; margin: 12px 0; font-size: 1.1rem; }
              </style>
            </head>
            <body>
              <h1>Automation-demo reports</h1>
              <a href="./playwright/index.html">Playwright e2e report</a>
              <a href="./stryker/index.html">Stryker mutation report</a>
            </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
