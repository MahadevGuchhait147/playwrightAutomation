name: Playwright Tests

on:
  push:
    branches:
      - create-playwright-framwork
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_Automation

    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://qaplayground.com' }}
      QA_COMPANY_PATH: ${{ vars.QA_COMPANY_PATH || '/bank/login' }}
      QA_COMPANY_USERNAME: ${{ secrets.QA_COMPANY_USERNAME }}
      QA_COMPANY_PASSWORD: ${{ secrets.QA_COMPANY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Playwright_Automation/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Ensure flaky history directory exists
        run: mkdir -p test-results

      - name: Restore flaky history cache
        id: flaky-cache
        uses: actions/cache/restore@v4
        with:
          path: Playwright_Automation/test-results/flaky-history.json
          key: flaky-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            flaky-history-${{ github.ref_name }}-
            flaky-history-

      - name: Run Playwright tests
        id: e2e
        run: npm test

      - name: Save flaky history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Playwright_Automation/test-results/flaky-history.json
          key: flaky-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload flaky history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-history
          path: Playwright_Automation/test-results/flaky-history.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: Playwright_Automation/test-results/results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_Automation/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Flaky HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report
          path: Playwright_Automation/flaky-report
          if-no-files-found: warn
          retention-days: 30

      - name: Write flaky report to job summary
        if: always()
        working-directory: .
        run: |
          node <<'EOF'
          const fs = require('fs');
          const historyPath = 'Playwright_Automation/test-results/flaky-history.json';
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          let md = '## Flaky test report\n\n';

          if (!fs.existsSync(historyPath)) {
            md += '_No flaky history file found._\n';
            fs.appendFileSync(summaryPath, md);
            process.exit(0);
          }

          const history = JSON.parse(fs.readFileSync(historyPath, 'utf8'));
          const tests = Object.values(history.tests || {});
          const flakyTests = tests
            .filter((t) => (t.flaky || 0) > 0)
            .sort((a, b) => (b.flakyRate || 0) - (a.flakyRate || 0));
          const flakyThisRun = tests.filter((t) => t.lastStatus === 'flaky');

          md += `| Metric | Value |\n|---|---|\n`;
          md += `| Total tracked runs | ${history.totalRuns ?? 0} |\n`;
          md += `| Last updated | ${history.updatedAt ?? 'n/a'} |\n`;
          md += `| Flaky in this run | ${flakyThisRun.length} |\n`;
          md += `| Tests with flaky history | ${flakyTests.length} |\n\n`;

          if (flakyThisRun.length) {
            md += '### Flaky in this run\n\n';
            for (const t of flakyThisRun) {
              md += `- \`${t.file}\` › **${t.title}**\n`;
            }
            md += '\n';
          } else {
            md += '_No flaky tests in this run._\n\n';
          }

          if (flakyTests.length) {
            md += '### Top flaky tests (history)\n\n';
            md += '| Test | File | Flaky | Total | Rate |\n|---|---|---:|---:|---:|\n';
            for (const t of flakyTests.slice(0, 20)) {
              const rate = `${((t.flakyRate || 0) * 100).toFixed(1)}%`;
              md += `| ${t.title} | \`${t.file}\` | ${t.flaky} | ${t.totalRuns} | ${rate} |\n`;
            }
            md += '\n';
          }

          md += 'Download the **flaky-history** artifact for the full JSON history.\n';
          fs.appendFileSync(summaryPath, md);
          EOF

      - name: Build GitHub Pages report site
        if: always()
        working-directory: .
        run: |
          mkdir -p site/playwright site/flaky
          if [ -d Playwright_Automation/playwright-report ]; then
            cp -R Playwright_Automation/playwright-report/. site/playwright/
          fi
          if [ -d Playwright_Automation/flaky-report ]; then
            cp -R Playwright_Automation/flaky-report/. site/flaky/
          fi
          if [ -f Playwright_Automation/test-results/flaky-history.json ]; then
            cp Playwright_Automation/test-results/flaky-history.json site/flaky-history.json
          else
            echo '{"updatedAt":null,"totalRuns":0,"tests":{}}' > site/flaky-history.json
          fi
          if [ -f Playwright_Automation/test-results/results.json ]; then
            cp Playwright_Automation/test-results/results.json site/results.json
          fi
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Automation Demo Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
              a { color: #0969da; }
              code { background: #f6f8fa; padding: 0.1rem 0.35rem; border-radius: 4px; }
              ul { padding-left: 1.2rem; }
            </style>
          </head>
          <body>
            <h1>Automation Demo Reports</h1>
            <ul>
              <li><a href="./playwright/">Playwright HTML report</a></li>
              <li><a href="./flaky/">Flaky HTML report</a></li>
              <li><a href="./results.json">Playwright results (JSON)</a></li>
              <li><a href="./flaky-history.json">Flaky history (JSON)</a></li>
            </ul>
            <p>Flaky detection uses Playwright retries + <code>reporters/flaky-reporter.ts</code>.</p>
          </body>
          </html>
          HTML

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: test
    if: always() && needs.test.result != 'cancelled'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
