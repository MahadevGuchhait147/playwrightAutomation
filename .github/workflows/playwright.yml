name: Playwright Tests

on:
  push:
    branches:
      - 'create-playwright-framwork'
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Playwright_Automation
    env:
      CURRENTS_PROJECT_ID: ${{ vars.CURRENTS_PROJECT_ID || 'ZxWc6z' }}
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      RP_ENDPOINT: ${{ vars.RP_ENDPOINT || 'http://localhost:8080/api/v2' }}
      RP_PROJECT: ${{ vars.RP_PROJECT || 'superadmin_personal' }}
      RP_API_KEY: ${{ secrets.RP_API_KEY }}
      RP_LAUNCH: ${{ vars.RP_LAUNCH || 'Playwright Evaluation' }}
      QA_COMPANY_PATH: ${{ vars.QA_COMPANY_PATH || secrets.QA_COMPANY_PATH || '/' }}
      QA_COMPANY_USERNAME: ${{ secrets.QA_COMPANY_USERNAME }}
      QA_COMPANY_PASSWORD: ${{ secrets.QA_COMPANY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Playwright_Automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate Currents configuration
        run: |
          if [ -z "$CURRENTS_RECORD_KEY" ]; then
            echo "CURRENTS_RECORD_KEY secret is missing. Add it in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$APPLITOOLS_API_KEY" ]; then
            echo "APPLITOOLS_API_KEY secret is missing. Add it in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_Automation/playwright-report/
          retention-days: 30
