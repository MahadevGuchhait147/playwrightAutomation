name: Playwright Tests

on:
  push:
    branches:
      - 'create-playwright-framework'
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Playwright_Automation
    env:
      CURRENTS_PROJECT_ID: ${{ vars.CURRENTS_PROJECT_ID || 'ZxWc6z' }}
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Playwright_Automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate Currents configuration
        run: |
          if [ -z "$CURRENTS_RECORD_KEY" ]; then
            echo "CURRENTS_RECORD_KEY secret is missing. Add it in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_Automation/playwright-report/
          retention-days: 30
