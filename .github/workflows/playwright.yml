name: Playwright Tests

on:
  push:
    branches:
      - create-playwright-framwork
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_Automation

    env:
      QA_COMPANY_PATH: ${{ vars.QA_COMPANY_PATH || '/' }}
      QA_COMPANY_USERNAME: ${{ secrets.QA_COMPANY_USERNAME }}
      QA_COMPANY_PASSWORD: ${{ secrets.QA_COMPANY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Playwright_Automation/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: .

      - name: Run unit tests (Vitest)
        run: npm run test:unit
        working-directory: .

      - name: Run mutation tests (Stryker)
        run: npm run test:mutation
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Playwright Report
        uses: actions/upload-pages-artifact@v3
        with:
          path: Playwright_Automation/playwright-report

  deploy:
    needs: test

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4